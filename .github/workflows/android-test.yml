name: [TEMP] Android build test

# Temporary isolated workflow for iterating on the Android build without
# touching main / bumping version / rebuilding Windows/macOS/Linux.
# Delete once the build-android job in tauri-release.yml is proven working.

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build — Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: src-tauri/gen/android/app/.cxx
          key: android-tauri-target-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: android-tauri-target-

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify VITE_API_BASE
        run: |
          if [ -z "${{ secrets.VITE_API_BASE }}" ]; then
            echo "::error::VITE_API_BASE secret is not set!"
            exit 1
          fi
          echo "VITE_API_BASE OK: ${{ secrets.VITE_API_BASE }}"

      - name: Init Tauri Android project
        run: pnpm exec tauri android init

      - name: Add required Android permissions
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PY'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              xml = f.read()
          perms = [
              'android.permission.RECORD_AUDIO',
              'android.permission.CAMERA',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.POST_NOTIFICATIONS',
          ]
          for p in perms:
              tag = f'<uses-permission android:name="{p}" />'
              if p not in xml:
                  xml = xml.replace('</manifest>', f'    {tag}\n</manifest>')
          with open(path, 'w') as f:
              f.write(xml)
          print('Permissions ensured:', perms)
          PY
          echo "=== AndroidManifest.xml ==="
          cat "$MANIFEST"

      - name: Build Android APK (debug-signed, universal)
        env:
          VITE_API_BASE:       ${{ secrets.VITE_API_BASE }}
          VITE_TURN_URL:       ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USERNAME:  ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        run: pnpm exec tauri android build --apk --debug

      - name: Collect Android artifact
        run: |
          mkdir -p android-dist
          APK=$(find src-tauri/gen/android -name "*.apk" -path "*debug*" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: no debug APK found under src-tauri/gen/android"
            find src-tauri/gen/android -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          cp "$APK" "android-dist/Cordyn_test.apk"
          ls -lh android-dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-test
          retention-days: 3
          path: android-dist/*
